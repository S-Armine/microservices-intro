x-logging-env: &logging-env
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: ${LOCALSTACK_SERVICES}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "4566:4566"
    volumes:
      - ./init-scripts/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket staging-bucket && awslocal s3api head-bucket --bucket permanent-bucket"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resource-db
      POSTGRES_USER: ${RESOURCE_DB_USERNAME}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/resource-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: song-db
      POSTGRES_USER: ${SONG_DB_USERNAME}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/song-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    environment:
      <<: *logging-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://resource-db:5432/resource-db
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SERVER_PORT: ${RESOURCE_SERVICE_PORT:-8080}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RESOURCE_PROCESSOR_QUEUE: ${RESOURCE_PROCESSOR_QUEUE}
      RESOURCE_PROCESSED_QUEUE: ${RESOURCE_PROCESSED_QUEUE:-resource-processed}
    ports:
      - "${RESOURCE_SERVICE_PORT:-8080}:${RESOURCE_SERVICE_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${RESOURCE_SERVICE_PORT:-8080}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      resource-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage-service:
        condition: service_healthy

  resource-processor:
    build:
      context: .
      dockerfile: resource-processor/Dockerfile
    environment:
      <<: *logging-env
      SERVER_PORT: ${RESOURCE_PROCESSOR_PORT:-8082}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RESOURCE_PROCESSOR_QUEUE: ${RESOURCE_PROCESSOR_QUEUE}
      RESOURCE_PROCESSED_QUEUE: ${RESOURCE_PROCESSED_QUEUE:-resource-processed}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${RESOURCE_PROCESSOR_PORT:-8082}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      song-service:
        condition: service_healthy

  song-service:
    build:
      context: .
      dockerfile: song-service/Dockerfile
    environment:
      <<: *logging-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://song-db:5432/song-db
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      SERVER_PORT: ${SONG_SERVICE_PORT:-8081}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    deploy:
      replicas: 2
    ports:
      - "${SONG_SERVICE_PORT:-8081}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${SONG_SERVICE_PORT:-8081}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      song-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    environment:
      <<: *logging-env
      SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:${EUREKA_SERVER_PORT:-8761}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${EUREKA_SERVER_PORT:-8761}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *logging-env
      SERVER_PORT: ${API_GATEWAY_PORT:-8083}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    ports:
      - "${API_GATEWAY_PORT:-8083}:${API_GATEWAY_PORT:-8083}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${API_GATEWAY_PORT:-8083}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      eureka-server:
        condition: service_healthy

  storage-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storage-db
      POSTGRES_USER: ${STORAGE_DB_USERNAME}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - ./init-scripts/storage-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    environment:
      <<: *logging-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://storage-db:5432/storage-db
      SPRING_DATASOURCE_USERNAME: ${STORAGE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${STORAGE_DB_PASSWORD}
      SERVER_PORT: ${STORAGE_SERVICE_PORT:-8084}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "${STORAGE_SERVICE_PORT:-8084}:${STORAGE_SERVICE_PORT:-8084}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${STORAGE_SERVICE_PORT:-8084}/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      storage-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      localstack:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  elasticsearch-data:
  filebeat-data:
  prometheus-data:
  grafana-data:
