spring.application.name=api-gateway
server.port=${API_GATEWAY_PORT:8083}

spring.cloud.gateway.server.webflux.routes[0].id=resource-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://resource-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/resources/**

spring.cloud.gateway.server.webflux.routes[1].id=song-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://song-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/songs/**

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.instanceId=${spring.application.name}:${random.uuid}

management.endpoints.web.exposure.include=health,info
