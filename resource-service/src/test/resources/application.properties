spring.application.name=resource-service

song.service.url=http://song-service
song.service.path=/songs

storage.service.url=http://storage-service
storage.service.path=/storages

spring.datasource.url=jdbc:h2:mem:resourcedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

eureka.client.enabled=false

aws.localstack.endpoint=http://localhost:4566
aws.localstack.region=us-east-1

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=app
spring.rabbitmq.password=app
resource.processing.queue=resource-processing
resource.processing.exchange=resource-processing-exchange
resource.processing.routing-key=resource-processing-routing-key
resource.processed.queue=resource-processed
resource.processed.exchange=resource-processed-exchange
resource.processed.routing-key=resource-processed-routing-key

storage.fallback.staging.id=1
storage.fallback.staging.bucket=staging-bucket
storage.fallback.staging.path=resources
storage.fallback.permanent.id=2
storage.fallback.permanent.bucket=permanent-bucket
storage.fallback.permanent.path=resources
