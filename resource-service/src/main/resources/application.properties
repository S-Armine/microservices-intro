spring.application.name=resource-service

song.service.url=${SONG_SERVICE_URL:http://localhost:8081}
song.service.path=/songs

spring.datasource.url=${RESOURCE_DB_URL:jdbc:postgresql://localhost:5434/resource-db}
spring.datasource.username=${RESOURCE_DB_USERNAME:postgres}
spring.datasource.password=${RESOURCE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
