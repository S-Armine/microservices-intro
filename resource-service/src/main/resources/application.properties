spring.application.name=resource-service

song.service.url=http://song-service
song.service.path=/songs

spring.datasource.url=${RESOURCE_DB_URL:jdbc:postgresql://localhost:5434/resource-db}
spring.datasource.username=${RESOURCE_DB_USERNAME:postgres}
spring.datasource.password=${RESOURCE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.instanceId=${spring.application.name}:${random.uuid}

aws.localstack.endpoint=${AWS_ENDPOINT_URL:http://localhost:4566}
aws.localstack.region=${AWS_DEFAULT_REGION:us-east-1}
aws.s3.bucket=${RESOURCE_S3_BUCKET:resources}
