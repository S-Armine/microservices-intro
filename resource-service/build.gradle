plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'maven-publish'
    id 'org.springframework.cloud.contract' version '5.0.3'
}

group = 'com.course.microservices'
version = '0.0.1-SNAPSHOT'
description = 'resource-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'io.cucumber:cucumber-java:7.34.9'
    testImplementation 'io.cucumber:cucumber-spring:7.34.9'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.9'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation platform('org.springframework.cloud:spring-cloud-contract-dependencies:5.0.3')
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    implementation "org.apache.tika:tika-core:3.3.2"
    implementation "org.apache.tika:tika-parser-audiovideo-module:3.3.2"
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.3')
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // Source: https://mvnrepository.com/artifact/software.amazon.awssdk/s3
    implementation("software.amazon.awssdk:s3:2.55.12")
}

contracts {
    baseClassForTests = 'com.course.microservices.resourceservice.contract.ContractVerifierBase'
    baseClassMappings {
        baseClassMapping('.*messaging.*', 'com.course.microservices.resourceservice.contract.MessagingContractBase')
    }
    testFramework = org.springframework.cloud.contract.verifier.config.TestFramework.JUNIT5
    testMode = org.springframework.cloud.contract.verifier.config.TestMode.MOCKMVC
}

publishing {
    publications {
        stubs(MavenPublication) {
            artifactId = project.name
            artifact verifierStubsJar
        }
    }
    repositories {
        maven {
            name = 'stubs'
            url = rootProject.layout.buildDirectory.dir('stubs-repo')
        }
    }
}

tasks.named('publishAllPublicationsToStubsRepository') {
    dependsOn 'contractTest'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn ':song-service:publishAllPublicationsToStubsRepository'

    inputs.dir(rootProject.layout.buildDirectory.dir('stubs-repo').map {
        it.dir('com').dir('course').dir('microservices').dir('song-service')
    })
            .withPropertyName('publishedStubs')

    systemProperty 'spring.cloud.contract.stubrunner.repository-root',
            rootProject.layout.buildDirectory.dir('stubs-repo').get().asFile.toURI().toString()
}

tasks.named('contractTest') {
    useJUnitPlatform()
}
