spring.application.name=resource-processor

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:app}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:app}
resource.processing.queue=${RESOURCE_PROCESSOR_QUEUE:resource-processing}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.instanceId=${spring.application.name}:${random.uuid}

song.service.url=${SONG_SERVICE_URL:http://song-service}
song.service.path=${SONG_SERVICE_PATH:/songs}
resource.service.url=${RESOURCE_SERVICE_URL:http://resource-service}
resource.service.path=${RESOURCE_SERVICE_PATH:/resources}
