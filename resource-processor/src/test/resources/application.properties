spring.application.name=resource-processor

# there is no broker in the tests: the listener containers are created but never started
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=app
spring.rabbitmq.password=app
spring.rabbitmq.listener.simple.auto-startup=false
resource.processing.queue=resource-processing

# the service names are resolved by the simple discovery client, see the support classes
eureka.client.enabled=false

song.service.url=http://song-service
song.service.path=/songs
resource.service.url=http://resource-service
resource.service.path=/resources
