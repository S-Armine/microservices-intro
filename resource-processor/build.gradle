plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.course.microservices'
version = '0.0.1-SNAPSHOT'
description = 'resource-processor'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.3')
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
    testImplementation 'io.cucumber:cucumber-java:7.34.9'
    testImplementation 'io.cucumber:cucumber-spring:7.34.9'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.9'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation platform('org.springframework.cloud:spring-cloud-contract-dependencies:5.0.3')
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation "org.apache.tika:tika-core:3.3.2"
    implementation "org.apache.tika:tika-parser-audiovideo-module:3.3.2"
}

tasks.named('test') {
    useJUnitPlatform()

    dependsOn ':resource-service:publishAllPublicationsToStubsRepository',
            ':song-service:publishAllPublicationsToStubsRepository'

    inputs.dir(rootProject.layout.buildDirectory.dir('stubs-repo'))
            .withPropertyName('publishedStubs')

    systemProperty 'spring.cloud.contract.stubrunner.repository-root',
            rootProject.layout.buildDirectory.dir('stubs-repo').get().asFile.toURI().toString()
}
