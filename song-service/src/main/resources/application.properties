spring.application.name=song-service
server.port=8081

spring.datasource.url=${SONG_DB_URL:jdbc:postgresql://localhost:5433/song-db}
spring.datasource.username=${SONG_DB_USERNAME:postgres}
spring.datasource.password=${SONG_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false